name: CD

on:
  push:
    branches: [preprod, prod]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
        env:
          CI: true

      - name: Test
        run: npm test
        env:
          CI: true

      - name: Build
        run: npm run build

      - name: Schema check
        run: npx prisma validate

      - name: Prisma format check
        run: npx prisma format --check

  deploy:
    name: CD / initiate deployment
    if: github.ref == 'refs/heads/preprod' || github.ref == 'refs/heads/prod'
    needs: [ci]
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/preprod' && 'preprod' || 'production' }}
    concurrency:
      group: migrate-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy and run migrations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            APP_DIR="/home/nlydevs/.hodifly/8c57e5b89786d068/current"
            cd "$APP_DIR"
            npx prisma migrate deploy
            echo "Initiate deployment"
