name: CD

on:
  push:
    branches: [preprod, prod]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Schema check
        run: npx prisma validate

      - name: Prisma format check
        run: npx prisma format --check

  deploy:
    name: initiate deployment
    if: github.ref == 'refs/heads/preprod' || github.ref == 'refs/heads/prod'
    needs: [ci]
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/preprod' && 'preprod' || 'production' }}
    concurrency:
      group: migrate-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Initiate deployment
        run: echo "Initiate ${{ github.ref_name }} deployment"
