name: CD

on:
  push:
    branches: [preprod, prod]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
        env:
          CI: true

      - name: Test
        run: npm test
        env:
          CI: true

      - name: Build
        run: npm run build

      - name: Schema check
        run: npx prisma validate

      - name: Prisma format check
        run: npx prisma format --check

  deploy:
    name: CD / initiate deployment
    if: github.ref == 'refs/heads/preprod' || github.ref == 'refs/heads/prod'
    needs: [ci]
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/preprod' && 'preprod' || 'production' }}
    concurrency:
      group: migrate-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Deploy and run migrations
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} '
            set -e
            if [ "${{ github.ref_name }}" = "prod" ]; then
              APP_DIR="/home/nlydevs/.hodifly/8c57e5b89786d068/current"
            else
              APP_DIR="/home/nlydevs/.hodifly/8c57e5b89786d068/current"
            fi
            cd "$APP_DIR"
            npx prisma migrate deploy
          '
