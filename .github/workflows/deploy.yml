name: CD

on:
  push:
    branches: [preprod, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "mysql://dummy:dummy@localhost:3306/dummy"
  BETTER_AUTH_SECRET: "ci-placeholder-secret-never-used-for-signing"
  SKIP_MIGRATIONS: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
        env:
          CI: true

  prisma:
    name: Prisma schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Check Prisma formatting
        run: npx prisma format --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Test
        run: npm test
        env:
          CI: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    name: Apply database migrations
    if: github.ref == 'refs/heads/preprod' || github.ref == 'refs/heads/prod'
    needs: [lint, typecheck, prisma, test, build]
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/preprod' && 'preprod' || 'prod' }}
    concurrency:
      group: migrate-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      APP_DIR: ${{ secrets.APP_DIR }}
    steps:
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Run Prisma migrations over SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${APP_DIR:?The APP_DIR environment secret is not configured}"
          printf -v APP_DIR_ESCAPED '%q' "$APP_DIR"
          ssh -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -e; cd ${APP_DIR_ESCAPED}; npx prisma migrate deploy"